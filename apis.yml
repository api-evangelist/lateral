aid: lateral
name: Lateral
description: 'Lateral was a Berlin- and Hobart-based AI research software company founded
  in 2013 that built machine-learning powered content recommendation and document navigation
  tools. Its early product was a conceptual text-matching and recommendation API that
  let developers insert documents and retrieve semantically similar content, with pre-populated
  corpora covering arXiv, PubMed, Wikipedia, news and SEC filings. The company later
  pivoted to an LLM-assisted research workspace for navigating information across large
  document sets, and published open-source research on hyperbolic-space word embeddings
  (Poincare embeddings, hyperplane hashers, WARP recommenders). Lateral was permanently
  shut down on 26 June 2025; the team pointed users to a successor open-source research
  platform at coordination.network. The public API, its documentation host and the
  application host are all retired, so this profile documents a historical API surface
  and the client libraries that remain published.'
